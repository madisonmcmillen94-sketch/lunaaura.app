<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Luna Aura</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10; /* Dark space background */
            color: #c5c6c7;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-image: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
        }
        .container {
            max-width: 600px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
            color: #a8a8aa;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .btn:hover {
            background-color: #e0e0e0;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Journey Begins</h1>
        <p>Thank you for exploring Luna Aura. Your path to discovering your 1-in-12-million celestial blueprint is now open. Check your device to open the app and receive your first daily reading.</p>
        <!-- The button links back to your main website -->
        <a href="index.html" class="btn">Return to Homepage</a>
    </div>
</body>
</html>
