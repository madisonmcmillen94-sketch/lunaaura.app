    <!-- Loading Screen Styles -->
    <style>
      body {
        margin: 0;
        background-color: #121417; /* Matches the deep, grounded aesthetic */
      }
      #initial-loader {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-image: radial-gradient(circle at 50% 0%, #1f232b 0%, #121417 70%);
        color: #bda282; /* Muted gold/earthy clay accent */
        font-family: 'Helvetica Neue', Arial, sans-serif;
        z-index: 9999;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 2px solid rgba(189, 162, 130, 0.2);
        border-top-color: #bda282;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-text {
        letter-spacing: 2px;
        font-size: 0.9rem;
        text-transform: uppercase;
        font-weight: 300;
